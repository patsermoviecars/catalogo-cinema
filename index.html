<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flota Cinema — Vehículos para Cine y Publicidad</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --card: #1e1e1e;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.18);
    --accent: #e8c84a;
    --accent-dim: rgba(232,200,74,0.12);
    --text: #f0ede6;
    --text-muted: #888;
    --text-dim: #555;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(14,14,14,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: 64px;
    display: flex; align-items: center; padding: 0 2rem;
    gap: 1.5rem;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text); }
  .header-search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 1rem;
    gap: 0.5rem;
    transition: border-color 0.2s;
  }
  .header-search:focus-within { border-color: var(--accent); }
  .header-search input {
    background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem; width: 100%; padding: 0.55rem 0;
  }
  .header-search input::placeholder { color: var(--text-dim); }
  .search-icon { color: var(--text-dim); font-size: 1rem; }
  .header-count {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .header-count span { color: var(--accent); font-weight: 500; }

  /* LAYOUT */
  .layout {
    display: flex;
    padding-top: 64px;
    min-height: 100vh;
  }

  /* SIDEBAR */
  aside {
    width: var(--sidebar-w);
    position: fixed; top: 64px; left: 0; bottom: 0;
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }
  .sidebar-section {
    padding: 0 1.25rem;
    margin-bottom: 1.5rem;
  }
  .sidebar-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
    padding-left: 0.25rem;
  }
  .cat-btn {
    display: block; width: 100%;
    text-align: left;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.83rem;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    margin-bottom: 2px;
    transition: all 0.15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat-btn:hover { background: var(--accent-dim); color: var(--text); }
  .cat-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 500;
  }
  .cat-btn .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 7px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .cat-btn.active .dot { opacity: 1; }

  /* MAIN */
  main {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 2rem;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: var(--border);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
    animation: fadeIn 0.35s ease both;
  }
  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-3px);
  }
  .card-img {
    width: 100%; aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #111;
  }
  .card-img-placeholder {
    width: 100%; aspect-ratio: 4/3;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 2rem;
  }
  .card-body { padding: 0.9rem 1rem; }
  .card-code {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .card-title {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 0.4rem;
  }
  .card-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex; gap: 0.5rem; flex-wrap: wrap;
  }
  .pill {
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%; max-width: 1100px;
    max-height: 90vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    animation: slideUp 0.25s ease;
  }
  @media (max-width: 600px) { .modal { grid-template-columns: 1fr; } }
  .modal-img {
    width: 100%; height: 100%; min-height: 420px;
    object-fit: cover;
    border-radius: 14px 0 0 14px; max-height: 600px;
  }
  @media (max-width: 600px) { .modal-img { border-radius: 14px 14px 0 0; min-height: 220px; } }
  .modal-img-placeholder {
    width: 100%; min-height: 420px;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 3rem;
    border-radius: 14px 0 0 14px; max-height: 600px;
  }
  .modal-body {
    padding: 2rem 1.75rem;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .modal-close {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(0,0,0,0.5); border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); }
  .modal-overlay { position: fixed; }
  .modal-wrap { position: relative; }
  .modal-code {
    font-size: 0.7rem; letter-spacing: 0.15em;
    color: var(--accent); text-transform: uppercase;
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; letter-spacing: 0.05em;
    line-height: 1.1; color: var(--text);
  }
  .spec-row {
    display: flex; align-items: baseline;
    gap: 0.5rem; padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .spec-row:last-of-type { border-bottom: none; }
  .spec-key { color: var(--text-muted); min-width: 120px; flex-shrink: 0; }
  .spec-val { color: var(--text); font-weight: 500; }
  .drive-btn {
    margin-top: 1rem;
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--accent); color: #0e0e0e;
    border: none; border-radius: 8px;
    padding: 0.65rem 1.25rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; font-weight: 500;
    cursor: pointer; text-decoration: none;
    transition: opacity 0.2s;
  }
  .drive-btn:hover { opacity: 0.85; }

  /* EMPTY */
  .empty {
    grid-column: 1/-1;
    padding: 4rem 0; text-align: center;
    color: var(--text-dim);
  }
  .empty p { margin-top: 0.5rem; font-size: 0.85rem; }

  /* LOADING */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 4rem; gap: 0.75rem;
    color: var(--text-muted);
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    aside { display: none; }
    main { margin-left: 0; padding: 1rem; }
    .header-count { display: none; }
  }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Logo" style="height:42px; object-fit:contain;">
  <div class="header-search">
    <span class="search-icon">&#9906;</span>
    <input type="text" id="searchInput" placeholder="Buscar por marca, modelo, código...">
  </div>
  <div class="header-count">Mostrando <span id="countDisplay">0</span> vehículos</div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">Categorías</div>
      <div id="catList"></div>
    </div>
  </aside>

  <main>
    <div class="section-title" id="sectionTitle">TODOS LOS VEHÍCULOS</div>
    <div id="grid" class="grid">
      <div class="loading" style="grid-column:1/-1">
        <div class="spinner"></div>
        Cargando inventario...
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-wrap">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal" id="modal">
      <div id="modalImg"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const SHEET_ID = '17JKdbU_p0TNWe6gG-B5qr5LCqsD1MKCCg_BZLjuIx1s';

const SHEET_NAME = 'Form Responses 1';

// Columnas del Sheet (índice 0 = columna A):
// A(0): Timestamp
// B(1): Marca
// C(2): Modelo
// D(3): Año
// E(4): Tipo (categoría/década)
// F(5): Color Exterior
// G(6): Color Interior
// H(7): Tiene Polarizado?
// I(8): Foto (link Google Drive)
// J(9): Nombres      — no se muestra en catálogo
// K(10): Apellidos   — no se muestra en catálogo
// L(11): Barrio o Ciudad
// M(12): Provincia
// N(13): Teléfono    — no se muestra en catálogo
// O(14): Correo      — no se muestra en catálogo
// P(15): Instagram   — no se muestra en catálogo

const COL = {
  timestamp: 0,
  marca: 1,
  modelo: 2,
  anio: 3,
  tipo: 4,
  colorExt: 5,
  colorInt: 6,
  polarizado: 7,
  fotoUrl: 8,
  ciudad: 11,
  provincia: 12,
};
// ============================================================

const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

let allData = [];
let activeCategory = 'Todos';
let activeDecada = 'Todas';

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const rows = json.table.rows;
    allData = rows
      .map(r => r.c.map(c => { if (!c || c.v === null || c.v === undefined) return ''; return c.f ? c.f : String(c.v); }))
      .filter(r => r[COL.marca] && String(r[COL.marca]).trim() !== '');
    buildSidebar();
    renderGrid(allData);
  } catch(e) {
    document.getElementById('grid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div style="font-size:2rem">⚙</div>
        <p>No se pudieron cargar los datos. Verificá que el Sheet esté publicado públicamente.</p>
        <p style="margin-top:0.5rem; color: #e8c84a; font-size:0.8rem">${e.message}</p>
      </div>`;
  }
}

function getDecada(anio) {
  const y = parseInt(anio);
  if (isNaN(y)) return null;
  return Math.floor(y / 10) * 10 + 's';
}

function buildSidebar() {
  // Tipos
  const tipos = ['Todos', ...new Set(allData.map(r => r[COL.tipo]).filter(Boolean).sort())];
  const tipoHTML = tipos.map(c => `
    <button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="filterCat('tipo','${c}')">
      <span class="dot"></span>${c}
    </button>`).join('');

  // Décadas
  const decadas = ['Todas', ...new Set(allData.map(r => getDecada(r[COL.anio])).filter(Boolean).sort())];
  const decadaHTML = decadas.map(d => `
    <button class="cat-btn ${d === activeDecada ? 'active' : ''}" onclick="filterCat('decada','${d}')">
      <span class="dot"></span>${d}
    </button>`).join('');

  document.getElementById('catList').innerHTML = `
    <div class="sidebar-label" style="margin-top:0">Por Tipo</div>
    ${tipoHTML}
    <div class="sidebar-label" style="margin-top:1.25rem">Por Década</div>
    ${decadaHTML}
  `;
}

function filterCat(tipo, val) {
  if (tipo === 'tipo') activeCategory = val;
  if (tipo === 'decada') activeDecada = val;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  applyFilters();
}

function applyFilters() {
  let filtered = allData;
  if (activeCategory !== 'Todos') filtered = filtered.filter(r => r[COL.tipo] === activeCategory);
  if (activeDecada !== 'Todas') filtered = filtered.filter(r => getDecada(r[COL.anio]) === activeDecada);
  const titulo = [activeCategory !== 'Todos' ? activeCategory : '', activeDecada !== 'Todas' ? activeDecada : ''].filter(Boolean).join(' · ') || 'TODOS LOS VEHÍCULOS';
  document.getElementById('sectionTitle').textContent = titulo.toUpperCase();
  renderGrid(filtered);
}

function renderGrid(data) {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q ? data.filter(r =>
    r.join(' ').toLowerCase().includes(q)
  ) : data;

  document.getElementById('countDisplay').textContent = filtered.length;

  if (!filtered.length) {
    document.getElementById('grid').innerHTML = `
      <div class="empty">
        <div style="font-size:2rem">○</div>
        <p>No se encontraron vehículos.</p>
      </div>`;
    return;
  }

  document.getElementById('grid').innerHTML = filtered.map((r, i) => {
    const imgTag = r[COL.fotoUrl]
      ? `<img class="card-img" src="${driveThumb(r[COL.fotoUrl])}" alt="${r[COL.marca]} ${r[COL.modelo]}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-img-placeholder>🚗</div>'">`
      : `<div class="card-img-placeholder">🚗</div>`;
    return `
    <div class="card" onclick="openModal(${i})" style="animation-delay:${Math.min(i*0.04,0.4)}s">
      ${imgTag}
      <div class="card-body">
        <div class="card-code">${r[COL.tipo] || ''}</div>
        <div class="card-title">${r[COL.anio]} ${r[COL.marca]} ${r[COL.modelo]}</div>
        <div class="card-meta">
          ${r[COL.colorExt] ? `<span class="pill">${r[COL.colorExt]}</span>` : ''}
          ${r[COL.ciudad] ? `<span class="pill">${r[COL.ciudad]}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  window._currentList = filtered;
}

function driveThumb(url) {
  const match = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
  const match2 = url.match(/id=([a-zA-Z0-9_-]{10,})/);
  if (match2) return `https://drive.google.com/thumbnail?id=${match2[1]}&sz=w600`;
  return url;
}

function renderModalImage(url, marca, modelo, anio) {
  const container = document.getElementById('modalImg');
  container.innerHTML = `<img class="modal-img" src="${url}" alt="${marca} ${modelo}"
    oncontextmenu="return false;"
    onerror="this.parentNode.innerHTML='<div class=modal-img-placeholder>🚗</div>'">`;
}

function openModal(idx) {
  const list = window._currentList || allData;
  const r = list[idx];
  if (!r) return;
  window._modalIdx = idx;

  if (r[COL.fotoUrl]) {
    renderModalImage(driveThumb(r[COL.fotoUrl]), r[COL.marca], r[COL.modelo], r[COL.anio]);
  } else {
    document.getElementById('modalImg').innerHTML = '<div class="modal-img-placeholder">🚗</div>';
  }

  const ubicacion = [r[COL.ciudad], r[COL.provincia]].filter(Boolean).join(', ');

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-code">${r[COL.tipo] || ''}</div>
    <div class="modal-title">${r[COL.anio]}<br>${r[COL.marca]} ${r[COL.modelo]}</div>
    <div style="margin-top:1rem">
      ${r[COL.colorExt] ? `<div class="spec-row"><span class="spec-key">Color exterior</span><span class="spec-val">${r[COL.colorExt]}</span></div>` : ''}
      ${r[COL.colorInt] ? `<div class="spec-row"><span class="spec-key">Color interior</span><span class="spec-val">${r[COL.colorInt]}</span></div>` : ''}
      ${r[COL.polarizado] ? `<div class="spec-row"><span class="spec-key">Polarizado</span><span class="spec-val">${r[COL.polarizado]}</span></div>` : ''}
      ${ubicacion ? `<div class="spec-row"><span class="spec-key">Ubicación</span><span class="spec-val">${ubicacion}</span></div>` : ''}
    </div>
    <a class="drive-btn" style="margin-top:1.5rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;"
      href="https://wa.me/5491165119417?text=${encodeURIComponent('Hola! Me gustaría ver más fotos del ' + r[COL.marca] + ' ' + r[COL.modelo] + ' ' + r[COL.anio] + (r[COL.colorExt] ? ' ' + r[COL.colorExt].toUpperCase() : ''))}"
      target="_blank">
      📷 Pedir más fotos de este auto
    </a>
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}


function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalBtn();
});

document.getElementById('searchInput').addEventListener('input', () => {
  applyFilters();
});

loadData();
</script>
</body>
</html>
